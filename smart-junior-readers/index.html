<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a7ddfc"><title>Smart Junior Readers • Зразок</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><noscript><p style="position:fixed;inset:20px;z-index:100;background:white;padding:30px">Відкрийте цю сторінку у браузері: для гортання, аудіо та ігор потрібен JavaScript.</p></noscript>
<div class="sky" aria-hidden="true"><i></i><i></i><i></i><span class="star s1">✦</span><span class="star s2">✧</span><span class="star s3">✦</span><span class="star s4">✦</span></div>
<div class="app">
<header><div class="brand"><b>Smart Junior <em>Readers</em></b><small>by Alla Yarova</small></div><nav aria-label="Оберіть ридер"><button data-grade="1" class="grade active" aria-pressed="true"><span>1</span><small>клас</small></button><button data-grade="2" class="grade" aria-pressed="false"><span>2</span><small>клас</small></button><button data-grade="3" class="grade" aria-pressed="false"><span>3</span><small>клас</small></button><button data-grade="4" class="grade" aria-pressed="false"><span>4</span><small>клас</small></button></nav><button class="fullscreen" id="fullscreen" aria-label="На весь екран">⛶</button></header>
<main aria-label="Ридер, який можна гортати"><button id="prev" class="arrow prev" aria-label="Попередня сторінка">‹</button><div id="book" class="book"><div class="leaf left"><img id="left-page" alt="Обкладинка ридера" draggable="false"></div><div class="spine" aria-hidden="true"></div><div class="leaf right"><img id="right-page" alt="Сторінка ридера" draggable="false"></div><div id="flip-sheet" aria-hidden="true"></div></div><button id="next" class="arrow next" aria-label="Наступна сторінка">›</button><div id="loading">Відкриваємо ридери…</div></main>
<div class="page-info"><span id="page-title">Smart Junior 1</span><span id="page-count" aria-live="polite"></span><div id="dots" aria-label="Перейти до сторінки"></div></div>
<footer><div class="tools"><button id="video-button" class="tool video"><span>▶</span><b>Відео</b></button><button id="audio-button" class="tool listen"><span>♫</span><b>Слухати</b></button><button id="game-button" class="tool play"><span>✦</span><b>Грати</b></button></div><a class="order" href="https://t.me/teacher_and_kids" target="_blank" rel="noopener">Замовити <span>↗</span></a></footer>
</div>
<dialog id="video-dialog"><div class="dialog-head"><b>Smart Junior Readers 1–4</b><button class="close" aria-label="Закрити відео">×</button></div><div class="video-body"><video id="video" controls playsinline preload="none" poster="assets/poster.jpg"><source src="assets/smart-junior-demo.mp4" type="video/mp4"></video></div></dialog>
<dialog id="audio-dialog"><div class="dialog-head"><div><small>LISTEN & READ</small><b id="audio-title"></b></div><button class="close" aria-label="Закрити озвучення">×</button></div><div class="listening-body"><div class="audio-art"><img id="audio-image" alt="Сторінка обраного уроку"></div><div class="audio-text"><div class="sound-controls"><button id="audio-play">▶ Слухати</button><button id="repeat">↻ Повторювати</button><label>Швидкість <select id="speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option></select></label></div><p id="audio-status" role="status">Натисніть речення, щоб послухати окремо.</p><div id="lines"></div></div></div><audio id="audio" preload="none"></audio></dialog>
<dialog id="game-dialog"><div class="dialog-head"><div><small>PLAY GAME</small><b id="game-title"></b></div><button class="close" aria-label="Закрити гру">×</button></div><div class="game-body" id="game-frame"></div><a id="game-link" target="_blank" rel="noopener">Відкрити гру окремо ↗</a></dialog>
<dialog id="zoom-dialog"><button class="close" aria-label="Закрити сторінку">×</button><img id="zoom-page" alt="Збільшена сторінка"></dialog>
</body></html>
